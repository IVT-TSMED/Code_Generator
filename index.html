<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PP65">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PP65 Code Tool</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0f1420;--card:#1a2130;--line:#2b3447;--txt:#e7ecf3;--mut:#93a0b4;--acc:#4da3ff;--ok:#3ecf8e;--bad:#ff6b6b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
  .wrap{max-width:600px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 20px}
  .tabs{display:flex;gap:6px;margin-bottom:16px}
  .tab{flex:1;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;text-align:center}
  .tab.on{color:var(--txt);border-color:var(--acc);background:#1d2942}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  h2{font-size:14px;margin:0 0 14px;color:var(--txt)}
  label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:600;letter-spacing:.02em}
  .row{display:flex;gap:12px;margin-bottom:14px}
  .row>div{flex:1}
  input[type=date],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);background:#121826;color:var(--txt);border-radius:10px;font-size:15px;font-family:inherit}
  input[type=text]{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
  button.go{width:100%;padding:13px;border:0;background:var(--acc);color:#071320;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
  button.go:active{transform:translateY(1px)}
  .out{margin-top:16px;padding:16px;border:1px dashed var(--line);border-radius:12px;background:#121826;display:none}
  .out.show{display:block}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;letter-spacing:.06em;word-break:break-all;color:#fff;margin:2px 0 12px}
  .copy{padding:8px 13px;border:1px solid var(--line);background:#1d2942;color:var(--txt);border-radius:9px;cursor:pointer;font-size:12px;font-weight:600}
  .copy.done{color:var(--ok);border-color:var(--ok)}
  .meta{font-size:13px;color:var(--mut);margin-top:10px}
  .meta b{color:var(--txt)}
  .vgood{color:var(--ok)}.vbad{color:var(--bad)}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px}
  .note{font-size:12px;color:var(--mut);margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  /* results list */
  .krow{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#121826}
  .krow .ktop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .krow .kname{font-weight:700;font-size:14px;color:var(--txt)}
  .krow .kcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;letter-spacing:.04em;color:#fff;word-break:break-all;margin:6px 0 10px}
  .badge{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .badge.ok{color:var(--ok);border:1px solid var(--ok)}
  .badge.maybe{color:var(--bad);border:1px solid var(--bad)}
  button.install{width:100%;margin:0 0 16px;padding:11px;border:1px solid var(--acc);background:transparent;color:var(--txt);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  button.install:active{transform:translateY(1px)}
  .install-note{font-size:12px;color:var(--mut);margin:-8px 0 16px}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <h1>PP65 Code Tool</h1>
  <p class="sub">Matachana sterilizer</p>
  <button class="install" id="install-app" type="button" hidden>Install app</button>
  <p class="install-note" id="install-note" hidden></p>

  <div class="tabs">
    <div class="tab on" data-t="acc">Access code</div>
    <div class="tab" data-t="scr">Screen codes</div>
  </div>

  <!-- TAB 1: VNC date access code -->
  <div id="acc">
    <div class="card">
      <h2>Generate access code</h2>
      <div class="row">
        <div><label>VALID FROM</label><input type="date" id="gfrom"></div>
        <div><label>VALID TO</label><input type="date" id="gto"></div>
      </div>
      <button class="go" id="gbtn">Generate code</button>
      <div class="err" id="gerr"></div>
      <div class="out" id="gout">
        <div class="code" id="gcode"></div>
        <button class="copy" id="gcopy">Copy</button>
        <div class="meta" id="gmeta"></div>
      </div>
    </div>
    <div class="card">
      <h2>Decode access code</h2>
      <label>CODE (16 hex digits)</label>
      <input type="text" id="dcode" placeholder="7c00d3dd0b36e761" maxlength="19" autocapitalize="off" spellcheck="false">
      <div style="height:12px"></div>
      <button class="go" id="dbtn">Decode code</button>
      <div class="err" id="derr"></div>
      <div class="out" id="dout"><div class="meta" id="dmeta"></div></div>
    </div>
    <p class="note">The access code is the date-window code the panel accepts while its clock is between the two dates (DES-encrypted; that's why rolling the date back locks it out).</p>
  </div>

  <!-- TAB 2: serial -> all derived codes -->
  <div id="scr" style="display:none">
    <div class="card">
      <h2>Screen codes from serial</h2>
      <label>SCREEN SERIAL (as shown on the panel, e.g. B6340168875)</label>
      <input type="text" id="sin" placeholder="B6340168875" autocapitalize="characters" spellcheck="false" maxlength="14">
      <div style="height:12px"></div>
      <button class="go" id="sbtn">Generate all codes</button>
      <div class="err" id="serr"></div>
      <div class="out" id="sout">
        <div class="meta" id="smeta" style="margin:0 0 12px"></div>
        <div id="slist"></div>
      </div>
    </div>
  </div>
</div>

function perm(bits,t){return t.map(x=>bits[x-1]);}
function keys(k){let bb=perm(b2bits(k),PC1),C=bb.slice(0,28),D=bb.slice(28),ks=[];for(let i=0;i<16;i++){for(let s=0;s<SHIFTS[i];s++){C.push(C.shift());D.push(D.shift());}ks.push(perm(C.concat(D),PC2));}return ks;}

function enc(blk){return crypt(blk,keys(KEY));}

/* ---------- helpers ---------- */
const hx=b=>b.map(x=>x.toString(16).padStart(2,'0')).join('');
const ck=(d,m,y)=>(d+m+y)&0xff;
function makeCode(fd,fm,fy,td,tm,ty){const f=fy-2000,t=ty-2000;return hx(enc([td,tm,t,ck(td,tm,t),fd,fm,f,ck(fd,fm,f)]));}
function parseDate(v){const[y,m,d]=v.split('-').map(Number);return{d,m,y};}
const fmt=(d,m,y)=>`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;

/* ---------- panel code types ---------- */
const TYPES=[
 {name:'Screen / System key', salt:'q#4gt7Nb8z!', status:'ok'},
 {name:'EasyLook PC Recorder', salt:'4xI[!6.3Un?', status:'ok'},
 {name:'XML PC Recorder',      salt:'gms[8X6YtB-', status:'ok'},
 {name:'OPC UA / Modbus TCP (option 1)', salt:'2Rg[4<J3sqM', status:'maybe'},
 {name:'OPC UA / Modbus TCP (option 2)', salt:'VbJ[Qu*%:-g', status:'maybe'},
 {name:'Oil change (130 low-temp)', salt:'q#8gT7k!8zW', status:'maybe'},
];
function skBuildSerial(v){
  var s=(v||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(s.length<5) return null;
  var prefix=s.slice(0,4);
  if(!/^[0-9A-F]{4}$/.test(prefix)) return null;
  var numpart=s.slice(4);
  if(!/^[0-9]+$/.test(numpart)) return null;
  var num=parseInt(numpart,10);
  if(isNaN(num)) return null;
  return prefix+String(num).padStart(7,'0');
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
  document.getElementById('acc').style.display=t.dataset.t==='acc'?'':'none';
  document.getElementById('scr').style.display=t.dataset.t==='scr'?'':'none';
});

/* ---------- defaults ---------- */
document.getElementById('gfrom').value='2027-01-06';
document.getElementById('gto').value='2028-01-06';

/* ---------- generate access code ---------- */
document.getElementById('gbtn').onclick=()=>{
  const gerr=document.getElementById('gerr');gerr.textContent='';
  const fv=document.getElementById('gfrom').value,tv=document.getElementById('gto').value;
  if(!fv||!tv){gerr.textContent='Pick both dates.';return;}
  const F=parseDate(fv),T=parseDate(tv);
  if(F.y<2000||F.y>2099||T.y<2000||T.y>2099){gerr.textContent='Year must be 2000-2099.';return;}
  if(new Date(tv)<=new Date(fv)){gerr.textContent='"Valid to" must be after "valid from".';return;}
  const code=makeCode(F.d,F.m,F.y,T.d,T.m,T.y);
  document.getElementById('gcode').textContent=code;
  document.getElementById('gmeta').innerHTML=`Valid <b>${fmt(F.d,F.m,F.y)}</b> &rarr; <b>${fmt(T.d,T.m,T.y)}</b>`;
  document.getElementById('gout').classList.add('show');
  const cb=document.getElementById('gcopy');cb.textContent='Copy';cb.classList.remove('done');
  cb.onclick=()=>{navigator.clipboard.writeText(code).then(()=>{cb.textContent='Copied ✓';cb.classList.add('done');},()=>{});};
};
document.getElementById('gbtn').click();

/* ---------- decode access code ---------- */
document.getElementById('dbtn').onclick=()=>{
  const derr=document.getElementById('derr');derr.textContent='';
  document.getElementById('dout').classList.remove('show');
  let s=document.getElementById('dcode').value.trim().toLowerCase().replace(/[^0-9a-f]/g,'');
  if(s.length!==16){derr.textContent='Enter exactly 16 hex digits.';return;}
  const blk=s.match(/../g).map(x=>parseInt(x,16));
  const b=dec(blk);
  const okT=ck(b[0],b[1],b[2])===b[3], okF=ck(b[4],b[5],b[6])===b[7];
  const from=fmt(b[4],b[5],2000+b[6]), to=fmt(b[0],b[1],2000+b[2]);
  const valid=okT&&okF;
  document.getElementById('dmeta').innerHTML=
    `Valid from <b>${from}</b><br>Valid to <b>${to}</b><br>`+
    `<span class="${valid?'vgood':'vbad'}">${valid?'✓ checksums valid (genuine code)':'✗ checksums do not match — not a valid code'}</span>`;
  document.getElementById('dout').classList.add('show');
};
document.getElementById('dcode').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('dbtn').click();});

/* ---------- serial -> all codes ---------- */
function esc(s){return s.replace(/</g,'&lt;').replace(/&/g,'&amp;');}
document.getElementById('sbtn').onclick=()=>{
  const serr=document.getElementById('serr');serr.textContent='';
  document.getElementById('sout').classList.remove('show');
  const serial=skBuildSerial(document.getElementById('sin').value);
  if(!serial){serr.textContent='Enter the serial as shown on the panel: 4-character prefix (e.g. B634) then the number, e.g. B6340168875.';return;}
  document.getElementById('smeta').innerHTML='Serial <b>'+serial+'</b>';
  const list=document.getElementById('slist');
  list.innerHTML=TYPES.map((T,i)=>{
    const key=md5hex(serial+T.salt).toUpperCase();
    const badge=T.status==='ok'?'<span class="badge ok">verified</span>':'<span class="badge maybe">unconfirmed</span>';
    return '<div class="krow"><div class="ktop"><span class="kname">'+T.name+badge+'</span>'+
           '<button class="copy" data-k="'+key+'">Copy</button></div>'+
           '<div class="kcode">'+key+'</div></div>';
  }).join('');
  list.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.k).then(()=>{b.textContent='Copied ✓';b.classList.add('done');},()=>{});});
  document.getElementById('sout').classList.add('show');
};
document.getElementById('sin').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('sbtn').click();});

/* ---------- install as an app ---------- */
(function(){
  const btn=document.getElementById('install-app');
  const note=document.getElementById('install-note');
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let deferred=null;
  if(!standalone){
    btn.hidden=false;
    if(ios){
      btn.textContent='Add to Home Screen';
      note.textContent='To install, tap the Share button, then Add to Home Screen.';
    }
  }
  window.addEventListener('beforeinstallprompt',function(event){
    event.preventDefault();
    deferred=event;
    btn.hidden=false;
    note.hidden=true;
  });
  window.addEventListener('appinstalled',function(){
    deferred=null;
    btn.hidden=true;
    note.hidden=true;
  });
  btn.addEventListener('click',function(){
    if(ios){note.hidden=false;return;}
    if(!deferred){
      note.textContent='Use the browser menu and choose Install app.';
      note.hidden=false;
      return;
    }
    const prompt=deferred;
    deferred=null;
    prompt.prompt();
    prompt.userChoice.then(function(choice){
      if(choice.outcome==='accepted'){btn.hidden=true;note.hidden=true;}
    });
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
